name: Release

on:
  push:
    tags:
      - "v*"
  # Dry run: builds the binaries, skips release creation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install wayland dev headers
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev

      - name: Build linux binaries
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p dist
          # Stamp the tag into the binary so -version reports the release that
          # was actually built instead of a literal that goes stale.
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X github.com/Nomadcxx/sysc-walls/internal/version.Version=$VERSION"
          go build -buildvcs=true -ldflags "$LDFLAGS" -o dist/sysc-walls-daemon ./cmd/daemon
          go build -buildvcs=true -ldflags "$LDFLAGS" -o dist/sysc-walls-display ./cmd/display
          go build -buildvcs=true -ldflags "$LDFLAGS" -o dist/sysc-walls-client ./cmd/client
          for binary in dist/sysc-walls-*; do
            info="$(go version -m "$binary")"
            grep -q "vcs.revision=${GITHUB_SHA}$" <<< "$info"
            grep -q "vcs.modified=false$" <<< "$info"
          done
          for binary in dist/sysc-walls-daemon dist/sysc-walls-display; do
            test "$("$binary" -version | cut -d ' ' -f 2)" = "$VERSION"
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sysc-walls-binaries
          path: dist/

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to do"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --latest \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
